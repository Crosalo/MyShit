# Zentrale Konfiguration fuer Pocket Logic. Alle Einstellungen stehen hier.
channel:
  name: "Pocket Logic"
  tagline: "Money, explained in 40 seconds"
  language: en
  youtube_category: 28        # Science & Technology
  made_for_kids: false

brand:                        # siehe assets/ fuer Logo
  bg: "#120A24"
  panel: "#221542"
  ink: "#F5F0FF"
  accent: "#C77DFF"           # wichtigstes Wort, Zahl, aktives Untertitelwort
  label: "#FF5CC8"            # nur Serien-/Formatlabel
  font_bold: "Inter-ExtraBold.otf"
  font_medium: "Inter-Medium.otf"

content:
  categories:
    - "Everyday spending & hidden costs"
    - "Saving & compound interest"
    - "Price psychology"
    - "Taxes, inflation & fees explained"
    - "Money myths"
  formats:
    - "Where does your money go?"
    - "Myth vs. Fact"
    - "The math behind ..."
    - "3 money traps"
    - "What happens if ..."
  no_repeat_days: 60          # Thema darf nicht innerhalb dieser Tage wiederkehren
  disclaimer: "Educational content, not financial advice."

cta:
  enabled: true
  max_words: 10                 # gesprochener CTA-Satz
  position_min: 0.30            # Anteil des Skripts, ab dem der CTA kommen darf ...
  position_max: 0.70            # ... und bis zu dem er gekommen sein muss
  min_seconds: 1.8              # Einblendung mindestens so lange sichtbar

script:
  words_min: 55                 # ~20-30 s: kurze Shorts halten die Zuschauer besser
  words_max: 95                 # inkl. CTA-Satz
  title_max_chars: 60
  hook_max_words: 9
  max_attempts: 3

tts:
  voice: "en-US-AndrewNeural"   # klare US-Stimme; Alternativen: en-US-AriaNeural, en-US-GuyNeural
  rate: "+15%"                  # zuegiges Tempo
  max_seconds: 38               # laenger -> Claude kuerzt das Skript

claude:
  command: "claude"
  timeout_seconds: 240
  rate_limit_wait_minutes: 20   # bei Pro-Limit spaeter erneut versuchen statt abbrechen
  rate_limit_max_waits: 6

visuals:
  sources: ["pexels", "pixabay"] # Reihenfolge = Vorrang
  min_height: 1080              # kleinere Clips werden ignoriert
  max_download_mb: 150
  per_page: 20                  # Treffer pro Suche
  request_pause_s: 0.8          # Pixabay: 100 Anfragen/60 s, Pexels: 200/Stunde
  api_cache_hours: 24           # Suchergebnisse 24 h cachen (Pixabay-Vorgabe, schont Limits)
  ken_burns_zoom: 1.08          # dezenter Zoom bei Standbildern
  ai_judge: true                # Claude prueft die Vorschaubilder und waehlt passende Clips
  judge_candidates: 9           # Kandidaten pro Szene auf dem Kontaktbogen (3x3)
  fallback_terms:               # bewaehrte Geld-Motive, falls die Szenen-Suche zu wenig liefert
    - "counting cash money"
    - "credit card payment"
    - "shopping bags woman"
    - "wallet with money"
    - "receipt paper"
    - "coins stack"
    - "supermarket shopping cart"
    - "calculator finance"
    - "online shopping laptop"
    - "dollar bills close up"

subtitles:
  max_words: 2                  # Woerter pro Einblendung (1-3)
  pause_break_s: 0.25           # Sprechpause -> neue Einblendung
  font_size: 112
  outline: 7
  margin_v: 560                 # Abstand von unten (mittleres unteres Drittel)

render:
  width: 1080
  height: 1920
  fps: 30
  preset: "veryfast"            # ffmpeg-Preset (Qualitaet vs. Laufzeit)
  crf: 21
  max_shot_s: 2.2               # spaetestens dann kommt ein Schnitt (Retention)
  punch_seconds: 1.4            # so lange steht der Punch-Text am Anfang
  slam_zoom: 1.10               # erstes Bild "knallt" rein: Start-Zoom ...
  slam_seconds: 0.30            # ... der in dieser Zeit auf 100 % faellt
  motion_zoom: 1.06             # staendige leichte Kamerabewegung (abwechselnd rein/raus)
  sfx: true                     # Aufprall am Anfang, Whoosh bei Szenenwechseln
  sfx_volume: 0.35
  sfx_min_gap_s: 2.0            # nicht oefter als alle 2 s ein Whoosh
  tail_s: 0.3                   # kurzer Nachlauf (Loop zurueck zum Anfang)
  audio_bitrate: "192k"
  loudness_lufs: -14
  music_volume: 0.20            # Hintergrundmusik vor dem Ducking

paths:
  data_dir: "data"
  run_log: "data/run_log.jsonl"
  lock_file: "data/pocketlogic.lock"
  cache_dir: "data/cache"
  music_dir: "data/music"       # eigene lizenzfreie Musik (mp3/m4a/wav) hier ablegen
  font_dir: "/usr/share/fonts/opentype/inter"

retention:
  work_days: 7                  # Clips/Zwischenschritte
  video_days: 30                # fertige Videos

schedule:
  local_time: "07:00"
  local_tz: "Europe/Zurich"
  publish_time: "15:00"
  publish_tz: "America/New_York"
