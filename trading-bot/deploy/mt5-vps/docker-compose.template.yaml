# MT5 im Browser auf dem Hostinger-VPS. Wird von deploy/build_bundle.py ausgefüllt (Startskript; EA-Paket kommt als Variable BUNDLE).
# Zugang: https://<VPS-IP>:3001 (selbstsigniertes Zertifikat), Benutzer/Passwort aus VNC_USER/VNC_PASSWORD.
name: mt5
services:
  mt5:
    image: ghcr.io/linuxserver/baseimage-kasmvnc:debianbookworm-073569bb-ls1
    restart: unless-stopped
    shm_size: "1gb"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - CUSTOM_USER=${VNC_USER}
      - PASSWORD=${VNC_PASSWORD}
      - BUNDLE=${BUNDLE}
    ports:
      - "3001:3001"
    volumes:
      - mt5config:/config
    configs:
      - source: wine
        target: /custom-cont-init.d/10-wine.sh
        mode: 0755
      - source: autostart
        target: /defaults/autostart
        mode: 0755
      - source: start
        target: /bot/start.sh
        mode: 0755
      - source: bundle2
        target: /bot/bundle2.b64

configs:
  wine:
    content: |
      #!/bin/bash
      # Hostinger baut keine Images: Wine beim ersten Start installieren (laeuft als root vor dem Desktop)
      command -v wine >/dev/null && exit 0
      export DEBIAN_FRONTEND=noninteractive
      rm -f /etc/apt/sources.list.d/nodesource*   # kaputte Quelle im Basis-Image (404) bricht apt-get update ab
      dpkg --add-architecture i386; apt-get update
      apt-get install -y --no-install-recommends wget gnupg ca-certificates cabextract xz-utils procps wmctrl
      mkdir -pm755 /etc/apt/keyrings
      wget -qO /etc/apt/keyrings/winehq-archive.key https://dl.winehq.org/wine-builds/winehq.key
      wget -qNP /etc/apt/sources.list.d/ https://dl.winehq.org/wine-builds/debian/dists/bookworm/winehq-bookworm.sources
      apt-get update   # Wine 10.0 fest: ab 10.3 meldet MT5 faelschlich "A debugger has been found" (Wine-Bug 57950)
      apt-get install -y --install-recommends winehq-stable=10.0.0.0~bookworm-1 wine-stable=10.0.0.0~bookworm-1 wine-stable-amd64=10.0.0.0~bookworm-1 wine-stable-i386=10.0.0.0~bookworm-1
  autostart:
    content: |
      bash /bot/start.sh &
  start:
    content: |
__START__

  bundle2:
    content: |
__BUNDLE2__

volumes:
  mt5config:
